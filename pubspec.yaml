name: media_picker
description: An audio/video/image picker in pure Dart, support multi picking.
version: 1.1.1
repository: https://github.com/TuanMinhVan/media_picker
publish_to: none
environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

workspace:
  - packages/picker_library

dependencies:
  picker_library:
    path: packages/picker_library
  extended_image: ">=8.3.0 <11.0.0"
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.2.0
  provider: ^6.0.5
  video_player: ^2.7.0
  visibility_detector: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - "assets/icon/"
