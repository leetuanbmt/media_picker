name: go_tip_app
description: A new Flutter project.

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  animations: ^2.0.11
  auto_route: ^10.0.1
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  extended_image: ^10.0.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_webrtc: ^0.13.1+hotfix.1
  freezed: ^3.0.6
  freezed_annotation: ^3.0.0
  geocoding: ^3.0.0
  geolocator: ^14.0.0
  hooks_riverpod: ^2.6.1
  intl: ^0.19.0
  json_annotation: ^4.9.0
  pinput: ^5.0.1
  retrofit: ^4.4.2
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  timeago: ^3.7.0
  toast: ^0.3.0
  uuid: ^4.5.1
  video_player: ^2.9.5
  flutter_facebook_auth: ^7.1.1
  provider: ^6.1.4
  flutter_parsed_text: ^2.2.1
  path_provider: ^2.1.5
  flutter_link_previewer: ^3.2.2
  flutter_chat_types: ^3.6.2
  photo_manager: ^3.6.4
  flutter_mentions: ^2.0.1
  flutter_portal: ^0.4.0
  url_launcher: ^6.3.1
  flutter_downloader: ^1.12.0
  photo_manager_image_provider: ^2.2.0
  hive: ^2.2.3
  scroll_to_index: ^3.0.1
  device_info_plus: ^11.3.3
  app_links: ^6.4.0
  internet_connection_checker_plus: ^2.7.1
  flutter_secure_storage: ^9.2.4
  country_code_picker: ^3.3.0
  flutter_local_notifications: ^19.1.0
  cloud_firestore: ^5.6.6
  flutter_slidable: ^4.0.0
  firebase_auth: ^5.5.2
  audioplayers: ^6.4.0
  permission_handler: ^12.0.0+1
  mobile_scanner: ^6.0.7
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  flutter_cache_manager: ^3.4.1
  sentry_flutter: ^8.14.1
  photo_view: ^0.15.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  retrofit_generator: ^9.1.9
  auto_route_generator: ^10.0.1
  flutter_gen_runner: ^5.10.0
  riverpod_generator: ^2.6.5
  flutter_application_id: ^2.1.0
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.3.0
  percent_indicator: ^4.2.5
  gmo_media_picker:
    git:
      url: https://${GITHUB_TOKEN}@github.com/leetuanbmt/media_picker.git
      ref: f2413ce57653153bbc53da5161a0219c2e6b4648

flutter_gen:
  output: lib/core/collections
  assets:
    outputs:
      class_name: Assets
      style: camel-case
  integrations:
    flutter_svg: true
  fonts:
    outputs:
      class_name: MyFontFamily
    enabled: true
  exclude: null

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/fonts/
    - assets/fonts/Poppins/
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/sounds/ringtone.mp3

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
        - asset: assets/fonts/Poppins/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
        - asset: assets/fonts/Poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins/Poppins-ThinItalic.ttf
