name: go_tip_app
description: A new Flutter project.

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.2 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dio: ^5.3.2
  retrofit: ^4.0.1
  auto_route: ^7.8.4
  intl: ^0.18.1
  flutter_screenutil: ^5.9.0
  velocity_x: ^4.1.1
  auto_size_text: ^3.0.0
  easy_localization: ^3.0.2
  freezed: ^2.4.2
  shared_preferences: ^2.2.0
  flutter_svg: ^2.0.7
  hooks_riverpod: ^2.4.2
  flutter_hooks: ^0.20.2
  riverpod_annotation: ^2.1.6
  toast: ^0.3.0
  pinput: ^3.0.1
  flutter_webrtc: ^0.9.45
  # web_socket_client: ^0.1.0
  audioplayers: ^5.1.0
  sentry_flutter: ^7.10.1
  synchronized: ^3.1.0
  permission_handler: ^11.0.1
  redacted: ^1.0.11
  percent_indicator: ^4.2.3

  mobile_scanner: ^3.4.1
  biometric_storage: ^5.0.0+4
  # flutter_local_notifications: ^16.0.0+1
  cached_network_image: ^3.2.3
  photo_view: ^0.14.0
  flutter_slidable: ^3.0.0
  flutter_cache_manager: ^3.3.1

  # firebase
  firebase_core: ^2.17.0
  cloud_firestore: ^4.9.3
  firebase_auth: ^4.10.1

  # login with social
  google_sign_in: ^6.1.5
  # twitter_login: ^4.4.2
  flutter_facebook_auth: ^6.0.1

  # media_kit
  # media_kit: ^1.1.8
  # media_kit_video: ^1.2.1
  # media_kit_libs_video: ^1.0.3

  animations: ^2.0.8
  uuid: ^3.0.7
  sign_in_with_apple: ^5.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  extended_image: ^8.1.1
  timeago: ^3.5.0
  video_player: ^2.7.2
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.0
  auto_route_generator: ^7.3.2
  flutter_gen_runner: ^5.3.1
  riverpod_generator: ^2.2.6
  flutter_application_id: ^2.0.0-dev

flutter_gen:
  assets:
    outputs:
      class_name: Assets
      style: camel-case
  integrations:
    flutter_svg: true
  fonts:
    outputs:
      class_name: MyFontFamily
    enabled: true
  exclude: null

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/fonts/
    - assets/fonts/Poppins/
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/sounds/ringtone.mp3

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
        - asset: assets/fonts/Poppins/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
        - asset: assets/fonts/Poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins/Poppins-ThinItalic.ttf
