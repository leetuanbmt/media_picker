name: gmo_media_picker
description: An audio/video/image picker in pure Dart, support multi picking.
version: 0.0.1
repository: https://github.com/TuanMinhVan/media_picker
environment:
  sdk: ">=2.15.0 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^1.3.10
  video_player: ^2.2.7
  photo_view: ^0.13.0
  wakelock: ^0.5.6
  extended_image: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
